services:
  crm-checklist:
    # Imagem publicada pelo workflow "Testes e imagem" a cada merge na main.
    # Atualizar: docker compose pull && docker compose up -d   (precisa de: docker login ghcr.io)
    # Para gerar a imagem nesta máquina em vez de baixar: docker compose up -d --build
    image: ${CRM_IMAGEM:-ghcr.io/buhlerr/crm-operacional:latest}
    build: .
    container_name: crm-operacional
    restart: unless-stopped
    ports:
      - "${PORTA:-8081}:8080"
    environment:
      - CHECKLIST_DADOS=/dados
      - SERVIDOR_HOST=0.0.0.0
      - SERVIDOR_PORTA=8080
      - SERVIDOR_THREADS=8
      - ATRAS_DE_PROXY=${ATRAS_DE_PROXY:-0}
      - SECRET_KEY=${SECRET_KEY:-}
      - LOGIN_PROVISORIO=${LOGIN_PROVISORIO:-0}
      - SENHA_PROVISORIA=${SENHA_PROVISORIA:-}
      # Portfólio público: ligam o selo "Modo Demo", o acesso rápido na tela de
      # entrada e o seed automático na subida (ver docker-compose.demo.yml).
      - MODO_DEMO=${MODO_DEMO:-0}
      - AUTO_SEED_DEMO=${AUTO_SEED_DEMO:-0}
    volumes:
      # O volume persistente guarda o banco de dados checklist.db, logs e backups
      - crm_dados:/dados

volumes:
  crm_dados:
    driver: local
